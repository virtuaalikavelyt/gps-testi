<!doctype html><html lang="fi"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Rakuunamäki GPS</title>
<style>body{font-family:system-ui;margin:0;background:#f4f4f4;color:#222}main{max-width:680px;margin:auto;padding:20px}.card{background:white;border-radius:16px;padding:20px}button{font-size:18px;padding:14px;width:100%;border:0;border-radius:12px;background:#222;color:white}#status{margin:18px 0;line-height:1.6}.p{padding:8px 0;border-top:1px solid #ddd}.done{font-weight:bold}small{color:#666}</style></head>
<body><main><div class="card"><h1>Rakuunamäki</h1><p>12 pisteen GPS/MP3-kävelytesti</p><button id="start">Aloita kävely</button><div id="status">Kävely ei ole käynnissä.</div><div id="list"></div><p><small>Pidä selain avoinna. Älä sammuta näyttöä virtapainikkeesta.</small></p></div></main>
<script>const pts=[{"name": "Suomen ratsuväen muistomerkki", "lat": 61.059663, "lon": 28.180214, "audio": "01_patsas.mp3", "radius": 20}, {"name": "Rakuunamäen pääportti & Pave Maijanen", "lat": 61.059783, "lon": 28.178977, "audio": "02_paaportti.mp3", "radius": 30}, {"name": "Päävartiorakennus", "lat": 61.0591569, "lon": 28.1784266, "audio": "03_paavartio.mp3", "radius": 30}, {"name": "Pohjustus ennen Rakuunahotellia", "lat": 61.0593719, "lon": 28.177457, "audio": "04_pohjustus.mp3", "radius": 30}, {"name": "Hotelli Rakuuna", "lat": 61.059266, "lon": 28.17633415, "audio": "05_hotellirakuuna.mp3", "radius": 30}, {"name": "Sotilaskoti", "lat": 61.059182, "lon": 28.175187, "audio": "06_sotilaskoti.mp3", "radius": 30}, {"name": "Vanha ruokala", "lat": 61.0591133, "lon": 28.1737116, "audio": "07_ruokala.mp3", "radius": 30}, {"name": "Chymoksen portti", "lat": 61.058047, "lon": 28.173163, "audio": "08_chymosportti.mp3", "radius": 30}, {"name": "Chymos", "lat": 61.0580152, "lon": 28.1722136, "audio": "09_chymos.mp3", "radius": 30}, {"name": "Upseerikerho", "lat": 61.0591837, "lon": 28.1705692, "audio": "10_upseerikerho.mp3", "radius": 30}, {"name": "Tuju Taproom", "lat": 61.0594142, "lon": 28.1737352, "audio": "11_tuju.mp3", "radius": 30}, {"name": "Adolf Ehrnroothin aukio", "lat": 61.060096, "lon": 28.174944, "audio": "12_aukio.mp3", "radius": 30}];const aud=pts.map(p=>new Audio(p.audio));
const startBtn=document.getElementById("start");
const statusEl=document.getElementById("status");
const listEl=document.getElementById("list");
let done=new Set(),playing=false,started=false,wake;
function d(a,b,c,e){const R=6371000,r=Math.PI/180,x=(e-b)*r*Math.cos((a+c)*r/2),y=(c-a)*r;return Math.sqrt(x*x+y*y)*R}
function draw(){listEl.innerHTML=pts.map((p,i)=>`<div class="p ${done.has(i)?"done":""}">${done.has(i)?"✓ ":""}${i+1}. ${p.name} <small>(${p.radius} m)</small></div>`).join("")}
async function awake(){try{if("wakeLock"in navigator)wake=await navigator.wakeLock.request("screen")}catch(e){}}
document.addEventListener("visibilitychange",()=>{if(document.visibilityState==="visible"&&started)awake()});
async function play(i){if(playing||done.has(i))return;playing=true;done.add(i);draw();let a=aud[i];a.currentTime=0;try{await a.play();statusEl.innerHTML=`<b>Kohde saavutettu!</b><br>${i+1}. ${pts[i].name}<br>Selostus soi.`}catch(e){statusEl.innerHTML=`<b>GPS laukesi:</b> ${pts[i].name}<br>Ääni ei käynnistynyt.`;playing=false}a.onended=()=>playing=false}
startBtn.onclick=async()=>{if(started)return;started=true;await awake();try{aud[0].muted=true;await aud[0].play();aud[0].pause();aud[0].currentTime=0;aud[0].muted=false}catch(e){}
statusEl.textContent="GPS käynnistyy…";navigator.geolocation.watchPosition(pos=>{let n=-1,nd=Infinity;pts.forEach((p,i)=>{if(done.has(i))return;let x=d(pos.coords.latitude,pos.coords.longitude,p.lat,p.lon);if(x<nd){nd=x;n=i}});if(n<0){statusEl.innerHTML=`GPS-tarkkuus: noin ${Math.round(pos.coords.accuracy)} m<br><b>Kaikki 12 kohdetta kuunneltu.</b>`;return}let p=pts[n];statusEl.innerHTML=`GPS-tarkkuus: noin ${Math.round(pos.coords.accuracy)} m<br>Lähin kuuntelematon piste: <b>${n+1}. ${p.name}</b><br>Etäisyys: <b>${Math.round(nd)} m</b> · laukaisu ${p.radius} m`;if(nd<=p.radius&&!playing)play(n)},e=>statusEl.textContent="GPS-virhe: "+e.message,{enableHighAccuracy:true,maximumAge:0,timeout:15000})};draw();</script></body></html>
