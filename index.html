<!doctype html><html lang="fi"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Rakuunamäki GPS MP3 -testi</title><style>
body{font-family:system-ui;margin:0;background:#f4f4f4;color:#222}main{max-width:650px;margin:auto;padding:22px}.card{background:#fff;border-radius:16px;padding:20px}
button{font-size:18px;padding:14px;width:100%;border:0;border-radius:12px;background:#222;color:#fff}.point{padding:9px 0;border-top:1px solid #ddd}#status{margin:18px 0;line-height:1.6}
</style></head><body><main><div class="card"><h1>Rakuunamäki – GPS/MP3-testi</h1>
<p>Neljä testipistettä. Selostus käynnistyy noin 30 metrin päässä.</p><button id="start">Aloita kävelytesti</button><div id="status">Testi ei ole käynnissä.</div><div id="points"></div>
<p><small>Pidä selain avoinna. Älä sammuta näyttöä virtapainikkeesta.</small></p></div></main><script>
const RADIUS=30;
const pts=[
["Suomen ratsuväen muistomerkki",61.059663,28.180214,"ratsuvaenpatsas.mp3"],
["Rakuunamäen pääportti & Pave Maijanen",61.0597830,28.1789770,"paaportti.mp3"],
["Päävartiorakennus",61.0591569,28.1784266,"paavartio.mp3"],
["Adolf Ehrnroothin aukio",61.060096,28.174944,"aukio.mp3"]];
const audio=pts.map(p=>new Audio(p[3]));let played=new Set(),playing=false,started=false,wake=null;
function dist(a,b,c,d){const R=6371000,r=Math.PI/180,x=(d-b)*r*Math.cos((a+c)*r/2),y=(c-a)*r;return Math.sqrt(x*x+y*y)*R}
function render(){points.innerHTML=pts.map((p,i)=>`<div class="point">${played.has(i)?"✓ ":""}${p[0]}</div>`).join("")}
async function awake(){try{if("wakeLock"in navigator)wake=await navigator.wakeLock.request("screen")}catch(e){}}
document.addEventListener("visibilitychange",()=>{if(document.visibilityState==="visible"&&started)awake()});
async function play(i){if(playing||played.has(i))return;playing=true;played.add(i);render();let a=audio[i];a.currentTime=0;
try{await a.play();status.innerHTML=`<b>Kohde saavutettu!</b><br>${pts[i][0]}<br>Selostus soi.`}catch(e){status.innerHTML=`<b>GPS laukesi:</b> ${pts[i][0]}<br>Ääni ei käynnistynyt.`;playing=false}
a.onended=()=>playing=false}
start.onclick=async()=>{if(started)return;started=true;await awake();
try{audio[0].muted=true;await audio[0].play();audio[0].pause();audio[0].currentTime=0;audio[0].muted=false}catch(e){}
status.textContent="GPS käynnistyy…";
navigator.geolocation.watchPosition(pos=>{let n=-1,nd=Infinity;pts.forEach((p,i)=>{let d=dist(pos.coords.latitude,pos.coords.longitude,p[1],p[2]);if(d<nd){nd=d;n=i}});
status.innerHTML=`GPS-tarkkuus: noin ${Math.round(pos.coords.accuracy)} m<br>Lähin piste: <b>${pts[n][0]}</b><br>Etäisyys: <b>${Math.round(nd)} m</b>`;
if(nd<=RADIUS&&!playing&&!played.has(n))play(n)},e=>status.textContent="GPS-virhe: "+e.message,{enableHighAccuracy:true,maximumAge:0,timeout:15000})};
render();</script></body></html>
