<!doctype html><html lang="fi"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>GPS äänitesti</title><style>body{margin:0;background:#ead8b3;color:#30241c;font-family:Arial}main{max-width:720px;margin:auto;padding:22px}.card{background:#f5ead3;border:1px solid #b69466;border-radius:10px;padding:18px;margin:14px 0}button{width:100%;padding:15px;margin:5px 0;background:#93462e;color:white;border:0;border-radius:6px;font-size:18px;font-weight:bold}.v{font-size:26px;font-weight:bold}.ok{color:#176b34}.hit{background:#dff0df;border:2px solid #176b34}audio{width:100%}</style></head><body><main><h1>GPS + automaattinen ääni</h1><p>Testipiste 61.0487120, 28.1238428 — säde 30 m.</p><div class="card"><button id="start">▶ Aloita kävelytesti</button><button id="stop" disabled>■ Lopeta testi</button><p id="status">Ei käynnissä</p><p>Näytön hereilläpito: <b id="wake">Ei käytössä</b></p></div><div id="target" class="card"><small>ETÄISYYS TESTIPISTEESEEN</small><div id="distance" class="v">–</div><p id="trigger">Odotetaan lähestymistä…</p><audio id="story" controls preload="auto" src="gps_testi_aani.mp3"></audio></div><div class="card">GPS-tarkkuus: <b id="accuracy">–</b><br>Ääni käynnistetty: <b id="fired">Ei</b></div><script>
const TLAT=61.0487120,TLON=28.1238428,R=30;let w=null,wake=null,fired=false;const E=x=>document.getElementById(x);
function d(a,b,c,e){const r=6371000,p=x=>x*Math.PI/180,A=p(c-a),B=p(e-b),q=Math.sin(A/2)**2+Math.cos(p(a))*Math.cos(p(c))*Math.sin(B/2)**2;return 2*r*Math.atan2(Math.sqrt(q),Math.sqrt(1-q))}
async function awake(){if("wakeLock"in navigator)try{wake=await navigator.wakeLock.request("screen");E("wake").textContent="Päällä ✓"}catch(e){E("wake").textContent="Ei onnistunut"}}
E("start").onclick=async()=>{await awake();fired=false;E("start").disabled=true;E("stop").disabled=false;const a=E("story");try{await a.play();a.pause();a.currentTime=0}catch(e){};w=navigator.geolocation.watchPosition(async p=>{let m=d(p.coords.latitude,p.coords.longitude,TLAT,TLON);E("distance").textContent=m<1000?Math.round(m)+" m":(m/1000).toFixed(2)+" km";E("accuracy").textContent=Math.round(p.coords.accuracy)+" m";E("status").textContent="GPS toimii";E("status").className="ok";if(!fired&&m<=R){fired=true;E("fired").textContent="KYLLÄ ✓";E("trigger").textContent="Kohde saavutettu – tarina alkaa";E("target").className="card hit";try{a.currentTime=0;await a.play()}catch(e){E("trigger").textContent="Kohde saavutettu – paina Play"}}},e=>E("status").textContent="GPS-virhe: "+e.message,{enableHighAccuracy:true,maximumAge:0,timeout:15000})};
E("stop").onclick=async()=>{if(w!==null)navigator.geolocation.clearWatch(w);w=null;E("story").pause();if(wake)try{await wake.release()}catch(e){};wake=null;E("start").disabled=false;E("stop").disabled=true;E("status").textContent="Testi lopetettu"};
</script></main></body></html>
